services:
  backend:
    image: file_manage-backend:latest
    container_name: file-share-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - database-data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?请设置JWT_SECRET环境变量，可用 openssl rand -base64 64 生成}
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=524288000
      - DATABASE_PATH=./data/database.sqlite
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: file_manage-frontend:latest
    container_name: file-share-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database-data:
